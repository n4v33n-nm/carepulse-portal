# =============================================================================
# CarePulse Portal - Spring Boot Configuration
# =============================================================================
spring.application.name=carepulse-portal
server.port=8080

# Import local development properties if present (strictly ignored in git)
spring.config.import=optional:classpath:application-local.properties

# =============================================================================
# PostgreSQL Datasource Configuration
# =============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/carepulse}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================================================
# JPA & Hibernate ORM Configuration
# =============================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.serialization.fail-on-empty-beans=false

# =============================================================================
# JWT Authentication Configuration
# =============================================================================
carepulse.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
carepulse.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# =============================================================================
# Logging Configuration
# =============================================================================
logging.level.com.carepulse=INFO
logging.level.org.springframework.security=WARN

# =============================================================================
# Emergency System Configuration (Phase 3)
# =============================================================================
emergency.morning.start=08:00
emergency.morning.end=14:00
emergency.evening.start=14:00
emergency.evening.end=20:00
emergency.night.start=20:00
emergency.night.end=08:00
emergency.assignment.timeout.minutes=10
emergency.roster.doctors-per-shift=1
emergency.queue.max-size=20
emergency.recovery.interval.ms=60000
