# =============================================================================
# CarePulse Portal - Spring Boot Configuration Template
# Copy this file to application-local.properties for your local environment
# =============================================================================
spring.application.name=carepulse-portal
server.port=8080

# =============================================================================
# PostgreSQL Datasource Configuration
# =============================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/carepulse
spring.datasource.username=your_postgres_username
spring.datasource.password=your_postgres_password
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================================================
# JPA & Hibernate ORM Configuration
# =============================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true

# =============================================================================
# JWT Authentication Configuration
# =============================================================================
carepulse.jwt.secret=your_secure_256bit_hex_secret_key_here
carepulse.jwt.expiration-ms=86400000

# =============================================================================
# Optional External AI Service Configuration
# =============================================================================
carepulse.ai.api-key=your_openai_or_gemini_api_key_here
